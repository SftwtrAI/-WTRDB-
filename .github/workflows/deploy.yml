name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

      - name: Create deployment archive
        run: |
          tar -czf deployment.tar.gz \
            dist/ \
            node_modules/ \
            package.json \
            package-lock.json \
            ecosystem.config.cjs \
            deploy.sh \
            drizzle.config.ts

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Upload deployment package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deployment.tar.gz,deploy.sh"
          target: "/root/wtropsai"

      - name: Deploy application on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/wtropsai
            chmod +x deploy.sh
            ./deploy.sh

      - name: Health check
        run: |
          echo "Waiting 10 seconds for application to start..."
          sleep 10
          echo "Checking server health..."
          curl -f http://${{ secrets.SERVER_IP }}:5000/health || curl -f http://${{ secrets.SERVER_IP }}:5000/ || echo "Health check endpoint not available - manual verification required"
